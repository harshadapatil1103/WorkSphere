# ============================================
# DATABASE CONNECTION - change these 3 values to match YOUR MySQL setup
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/employee_db?createDatabaseIfNotExist=true
spring.datasource.username=root

spring.datasource.password=YOUR_MYSQL_PASSWORD_HERE
spring.config.import=optional:classpath:application-local.properties
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA / Hibernate settings
# ============================================
# "update" = auto create/alter tables based on your Java classes (great for development)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================
# Server port (React will call this)
# ============================================
server.port=8080
